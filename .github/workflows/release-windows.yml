name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.7"
        required: true
        default: "v0.1.7"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for private story files
        shell: pwsh
        run: |
          $blockedExtensions = @("*.mhtml", "*.mht", "*.mhtm")
          $blockedDirs = @("runs", "master", "handoff", "debug", "mhtml_archive")

          $badFiles = @()
          foreach ($pattern in $blockedExtensions) {
            $badFiles += Get-ChildItem -Path . -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\.git\\" }
          }

          foreach ($dir in $blockedDirs) {
            $badFiles += Get-ChildItem -Path . -Recurse -Directory -Filter $dir -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch "\\.git\\" }
          }

          if ($badFiles.Count -gt 0) {
            Write-Host "Blocked private/generated files found:"
            $badFiles | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

      - name: Build Windows app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          powershell -ExecutionPolicy Bypass -File .\build_windows.ps1

      - name: Create release zip
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $zipName = "GrokStoryHandoff-windows-$version.zip"
          Compress-Archive -Path "dist\GrokStoryHandoff\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Grok Story Handoff ${{ github.event.inputs.version }}
          files: ${{ env.ZIP_NAME }}
          body: |
            ## Grok Story Handoff ${{ github.event.inputs.version }}

            Windows build for the Grok Story Handoff local story-folder workflow.

            ### Privacy reminder
            Do not upload private `.mhtml`, `master/`, `handoff/`, `runs/`, or `debug/` folders when reporting issues.
